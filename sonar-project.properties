sonar.organization=fiap-officine
sonar.projectKey=fiap-officine_fiap-officine-os-service
sonar.projectName=fiap-officine-os-service

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Entrypoint de processo e migrações não entram na análise de cobertura
sonar.coverage.exclusions=app/worker.py,alembic/**
sonar.exclusions=alembic/**

# Faz o job falhar se o Quality Gate (cobertura em código novo >= 80%,
# 0 bugs/vulnerabilidades novas) não passar.
sonar.qualitygate.wait=true
