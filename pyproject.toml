[project]
name = "fiap-officine-os-service"
version = "2.0.0"
description = "OS Service: ordens de serviço e orquestrador da saga (Tech Challenge SOAT Fase 4)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt<4.0.0",
    "fastapi>=0.136.1",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.14.0",
    "pydantic[email]>=2.13.3",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "newrelic>=9.0.0",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "pyyaml>=6.0.3",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[dynamodb,sqs]>=5.0",
    "pytest>=9.0.3",
    "pytest-bdd>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short -p no:cacheprovider --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP017", "UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
# Aplicação (não biblioteca): o uv instala só as dependências, sem build do projeto,
# o que permite --no-build (nenhum script de setup é executado)
package = false
