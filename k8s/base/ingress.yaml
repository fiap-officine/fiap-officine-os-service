# Roteamento por path no Traefik (K3s). Cada microsserviço publica o seu
# próprio Ingress; o Traefik combina as regras do namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - { path: /api/v1/ordens-servico, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /api/v1/clientes, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /api/v1/veiculos, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /api/v1/servicos, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /api/v1/pecas, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /api/v1/auth, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /api/v1/health, pathType: Exact, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /internal, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /health, pathType: Exact, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /docs, pathType: Prefix, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /redoc, pathType: Exact, backend: { service: { name: os-service, port: { number: 8000 } } } }
          - { path: /openapi.json, pathType: Exact, backend: { service: { name: os-service, port: { number: 8000 } } } }
