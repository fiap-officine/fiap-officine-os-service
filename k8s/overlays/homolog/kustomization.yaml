apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: os-service-config
    behavior: merge
    literals:
      - APP_ENV=homolog
      - DB_HOST=fiap-officine-homolog-rds.chmmasky8j6y.sa-east-1.rds.amazonaws.com
      - SQS_QUEUE_PREFIX=fiap-officine-homolog
      # Prazo curto para demonstrar o timeout/compensação no vídeo
      - SAGA_PAYMENT_TIMEOUT_SECONDS=120

# A imagem (ECR + tag = SHA do commit) é definida pelo pipeline:
#   kustomize edit set image os-service=<registry>/fiap-officine-os-service:<sha>
