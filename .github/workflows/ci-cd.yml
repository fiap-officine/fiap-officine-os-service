name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE: os-service
  ECR_REPOSITORY: fiap-officine-os-service
  AWS_REGION: us-east-2
  NAMESPACE: officine
  # Parâmetros publicados por fiap-officine-kubernets e fiap-officine-database
  SSM_PREFIX: /fiap-officine/homolog

jobs:
  # ── 1. Lint + testes (unit, integração, BDD) com cobertura mínima de 80% ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes + cobertura (gate 80%)
        run: uv run pytest --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ── 2. SonarCloud + Quality Gate (check obrigatório no PR) ──
  quality:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ── 3. Build e push da imagem no ECR (tag = SHA do commit) ──
  build-push:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  # ── 4. Deploy no Kubernetes (ambiente único: homolog, para develop e main) ──
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: homolog
    env:
      OVERLAY: homolog
      IMAGE: ${{ needs.build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kubeconfig (publicado pelo nó K3s no SSM; fallback no secret KUBE_CONFIG_DATA)
        env:
          KUBE_CONFIG_SECRET: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          KUBE_CONFIG_RAW=$(aws ssm get-parameter --name "$SSM_PREFIX/k3s/kubeconfig" \
            --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
          export KUBE_CONFIG_RAW="${KUBE_CONFIG_RAW:-$KUBE_CONFIG_SECRET}"
          pip install pyyaml >/dev/null && python scripts/setup_kubeconfig.py
          kubectl cluster-info

      - name: Segredos (gerados a partir de GitHub Secrets; nunca versionados)
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ADMIN_USER_SECRET: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD_SECRET: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_ADMIN_DB: ${{ secrets.DB_ADMIN_DB }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          # Endpoint e master do RDS publicados pelo fiap-officine-database (secrets como fallback)
          ssm() { aws ssm get-parameter --name "$SSM_PREFIX/$1" --with-decryption \
                    --query Parameter.Value --output text 2>/dev/null || true; }
          DB_HOST=$(ssm rds/address)
          DB_ADMIN_USER=$(ssm rds/master-username); DB_ADMIN_USER=${DB_ADMIN_USER:-$DB_ADMIN_USER_SECRET}
          DB_ADMIN_PASSWORD=$(ssm rds/master-password); DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD:-$DB_ADMIN_PASSWORD_SECRET}
          echo "::add-mask::$DB_ADMIN_PASSWORD"
          [ -n "$DB_HOST" ] || { echo "::error::rds/address não encontrado no SSM"; exit 1; }
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          kubectl -n "$NAMESPACE" create secret generic os-service-secrets \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=INTERNAL_API_TOKEN="$INTERNAL_API_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic os-service-db-admin \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_ADMIN_USER="$DB_ADMIN_USER" \
            --from-literal=DB_ADMIN_PASSWORD="$DB_ADMIN_PASSWORD" \
            --from-literal=DB_ADMIN_DB="${DB_ADMIN_DB:-postgres}" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=DB_NAME=os_db \
            --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "$NEW_RELIC_LICENSE_KEY" ]; then
            kubectl -n "$NAMESPACE" create secret generic newrelic-secret \
              --from-literal=license_key="$NEW_RELIC_LICENSE_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Bootstrap do banco lógico os_db (idempotente)
        run: |
          kubectl -n "$NAMESPACE" delete job os-service-db-bootstrap --ignore-not-found
          kubectl apply -f k8s/jobs/db-bootstrap.yaml
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/os-service-db-bootstrap --timeout=120s

      - name: Credencial do ECR para o K3s (imagePullSecret renovado a cada deploy)
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry ecr-pull \
            --docker-server="${IMAGE%%/*}" --docker-username=AWS \
            --docker-password="$(aws ecr get-login-password --region "$AWS_REGION")" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ecr-pull"}]}'

      - name: Deploy (Kustomize) + rollout
        run: |
          cd "k8s/overlays/$OVERLAY"
          sed -i "s#DB_HOST=.*#DB_HOST=$DB_HOST#" kustomization.yaml
          kustomize edit set image "os-service=$IMAGE"
          kustomize build . | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout status deployment/os-service --timeout=240s

      - name: Smoke test
        run: |
          kubectl -n "$NAMESPACE" run "smoke-os-${GITHUB_RUN_ID}" --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- \
            curl -fsS --retry 5 --retry-delay 3 http://os-service:8000/health
